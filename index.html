<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PLACEHOLDER - SEO. Replace the title, description, URLs and share image. -->
    <title>Your Name - Your Title</title>
    <meta name="description" content="PLACEHOLDER - one sentence on what you do and who you do it for." />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0B1E3F" />
    <!-- <link rel="canonical" href="https://yoursite.com/" /> -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Name" />
    <meta property="og:title" content="Your Name - Your Title" />
    <meta property="og:description" content="PLACEHOLDER - one sentence on what you do and who you do it for." />
    <!-- <meta property="og:url" content="https://yoursite.com/" /> -->
    <!-- <meta property="og:image" content="https://yoursite.com/share.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
